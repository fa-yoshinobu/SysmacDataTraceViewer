name: Release Single EXE

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    outputs:
      release_tag: ${{ steps.publish_release.outputs.release_tag }}
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.x

      - name: Validate tag and project version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG

          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            throw "Tag must look like v1.2.3."
          }
          $tagVersion = $Matches.version

          [xml]$project = Get-Content "src\SysmacDataTraceViewer\SysmacDataTraceViewer.csproj"
          $projectVersion = $project.Project.PropertyGroup.Version
          if ($projectVersion -ne $tagVersion) {
            throw "Tag version '$tagVersion' does not match project version '$projectVersion'."
          }

          "tag_name=$tag" >> $env:GITHUB_OUTPUT
          "project_version=$projectVersion" >> $env:GITHUB_OUTPUT
          "release_title=SysmacDataTraceViewer $tag" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore .\SysmacDataTraceViewer.sln

      - name: Build
        run: dotnet build .\SysmacDataTraceViewer.sln -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test SysmacDataTraceViewer.sln -c Release --no-build

      - name: Publish single-file EXE
        shell: pwsh
        run: |
          dotnet publish .\src\SysmacDataTraceViewer\SysmacDataTraceViewer.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o .\artifacts\release\win-x64

      - name: Set up release tools
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Prepare ZIP checksum and English release notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python .github/scripts/release_assets.py prepare --repository "$env:GITHUB_REPOSITORY" --release-tag "$env:RELEASE_TAG" --asset-name SysmacDataTraceViewer-win-x64.zip --file artifacts/release/win-x64/SysmacDataTraceViewer.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish ZIP and checksum
        id: publish_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $releaseArgs = @('release', 'create', $env:RELEASE_TAG, '--repo', $env:GITHUB_REPOSITORY,
            '--verify-tag', '--title', "Sysmac Data Trace Viewer $env:RELEASE_TAG", '--notes-file', 'artifacts/release/release-notes.md',
            'artifacts/release/SysmacDataTraceViewer-win-x64.zip', 'artifacts/release/SysmacDataTraceViewer-win-x64.zip.sha256')
          if ($env:RELEASE_TAG.Contains('-')) { $releaseArgs += '--prerelease' }
          gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "release_tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT

  check-published-release:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/virustotal-release.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
    secrets:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
