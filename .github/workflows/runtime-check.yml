name: Check bundled runtime
on:
  schedule:
    - cron: '17 1 * * 1'
  workflow_dispatch:
  pull_request:
    paths: ['src/SysmacDataTraceViewer/SysmacDataTraceViewer.csproj', '.github/scripts/check_runtime.py', '.github/workflows/runtime-check.yml']
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -B .github/scripts/check_runtime.py
